# Development overrides, applied automatically by `docker compose up`.
# - installs dev dependencies (pytest, ruff) into the image
# - mounts the source so code changes apply without rebuilding
# - uses Django's runserver with DEBUG on
#
# For a production-style run: docker compose -f docker-compose.yml up -d --build

x-dev: &dev
  build:
    context: .
    args:
      REQUIREMENTS: requirements-dev.txt
  image: workflow-studio:dev
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
  volumes:
    - .:/app
    - media:/app/media

services:
  migrate:
    <<: *dev

  web:
    <<: *dev
    command: python manage.py runserver 0.0.0.0:8000

  worker:
    <<: *dev

  # Rebuilds the editor bundle into the bind mount (apps/studio/static/studio/editor/) whenever
  # frontend/src changes. esbuild's watch mode polls, so it works on Windows bind mounts too.
  frontend:
    image: node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    working_dir: /src/frontend
    command: sh -c "npm ci --no-audit --no-fund && npm run watch"
    volumes:
      - .:/src
      # Linux packages, kept apart from any node_modules installed on the Windows side
      - frontend_node_modules:/src/frontend/node_modules
    restart: unless-stopped

volumes:
  frontend_node_modules:
