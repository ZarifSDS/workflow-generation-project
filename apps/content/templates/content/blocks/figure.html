{% load wagtailimages_tags %}
<figure class="article__figure">
    {% image value.image max-1440x1440 as img %}
    <img src="{{ img.url }}" alt="{{ value.image.contextual_alt_text }}" width="{{ value.width|default:img.width }}" height="{{ value.height|default:img.height }}" loading="lazy">
    {% if value.caption %}<figcaption>{{ value.caption }}</figcaption>{% endif %}
</figure>
